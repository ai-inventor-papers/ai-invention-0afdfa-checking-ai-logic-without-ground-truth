[project]
name = "m-irt"
version = "0.1.0"
description = "M-IRT: Metamorphic Item Response Theory pipeline for reference-free LLM evaluation"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.3",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "cloudpickle==3.1.2",
    "frozenlist==1.8.0",
    "girth==0.8.0",
    "idna==3.19",
    "joblib==1.6.0",
    "loguru==0.7.3",
    "multidict==6.7.1",
    "narwhals==2.25.0",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "propcache==0.5.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "six==1.17.0",
    "tenacity==9.1.4",
    "threadpoolctl==3.6.0",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
    "yarl==1.24.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]